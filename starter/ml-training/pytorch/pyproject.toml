[project]
name = "{project_name_slug}"
version = "0.1.0"
description = "{project_description}"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy>=2",
    "matplotlib>=3",
    "scikit-learn>=1.6",
]

[project.scripts]
train = "src.train:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
